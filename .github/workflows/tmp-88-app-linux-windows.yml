# TEMPORÁRIO (issue #88): confere o roteiro de docs/app.md compilando o app
# no Linux e no Windows. Sai da branch antes do merge.
name: tmp-88-app-linux-windows

on:
  push:
    branches: [feat/88-docs-readme-enxuto-operacao-em-docs-e-co]
    paths: ['.github/workflows/tmp-88-app-linux-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Pré-requisitos (docs/app.md)
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versões
        run: |
          set -x
          lsb_release -a
          rustc --version
          cargo --version
          node --version
          npm --version
      - name: Build (deb e AppImage)
        working-directory: ui
        run: |
          set -x
          npm ci
          npx tauri build --bundles deb,appimage
      - name: Pacotes gerados e instalação
        run: |
          set -x
          ls -la ui/src-tauri/target/release/bundle/deb ui/src-tauri/target/release/bundle/appimage
          dpkg-deb -I ui/src-tauri/target/release/bundle/deb/*.deb
          sudo apt-get install -y ./ui/src-tauri/target/release/bundle/deb/*.deb
          dpkg -L control-tower | grep -E 'bin/|\.desktop$'
          ldd /usr/bin/control-tower | grep -i "not found" && exit 1 || true
          chmod +x ui/src-tauri/target/release/bundle/appimage/*.AppImage
          ui/src-tauri/target/release/bundle/appimage/*.AppImage --appimage-extract >/dev/null
          ls squashfs-root/usr/bin

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versões
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          rustup show active-toolchain
          node --version
      - name: icon.ico (docs/app.md)
        working-directory: ui
        shell: pwsh
        run: |
          npm ci
          npx tauri icon src-tauri/icons/icon.png -o $env:RUNNER_TEMP/icons
          Copy-Item $env:RUNNER_TEMP/icons/icon.ico src-tauri/icons/icon.ico
          Get-ChildItem src-tauri/icons
      - name: Build (NSIS)
        working-directory: ui
        shell: pwsh
        run: npx tauri build --bundles nsis
      - name: Instalador gerado
        shell: pwsh
        run: Get-ChildItem -Recurse ui/src-tauri/target/release/bundle
