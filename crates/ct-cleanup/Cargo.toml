[package]
name = "ct-cleanup"
version.workspace = true
edition.workspace = true
license.workspace = true

# Limpeza do ambiente depois da conclusão do work item (#242): sessões,
# worktree, `target/` e branches, sobre o ciclo de vida das sessões e o sync.
[dependencies]
ct-agent.workspace = true
ct-core.workspace = true
ct-gh.workspace = true
ct-git.workspace = true
ct-gitlab.workspace = true
ct-ledger.workspace = true
ct-sessions.workspace = true
ct-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
# Tipos TypeScript para a UI (ts-rs).
ts = ["dep:ts-rs", "ct-core/ts", "ct-ledger/ts", "ct-sessions/ts", "ct-sync/ts"]

[dev-dependencies]
ct-gh = { workspace = true, features = ["test-support"] }
ct-gitlab = { workspace = true, features = ["test-support"] }
ct-sessions = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
